name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q witherbloom-fase1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Compilar
        working-directory: witherbloom
        run: gradle build --no-daemon
      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: witherbloom/build/libs/*.jar
