
name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar y descomprimir ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No se encontró ningún archivo ZIP."
            exit 1
          fi

          mkdir extracted
          unzip -q -o "$ZIP" -d extracted

      - name: Detectar proyecto
        run: |
          BUILD_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "No se encontró el proyecto Gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Corregir MobDef
        run: |
          FILE=$(find "$PROJECT_DIR" -name "Infection.java" | head -n 1)

          if [ -n "$FILE" ]; then
            sed -i -E 's/^([[:space:]]*)record MobDef\(/\1public record MobDef(/' "$FILE"
            sed -i -E 's/^([[:space:]]*)enum Mode/\1public enum Mode/' "$FILE"
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Compilar
        run: |
          gradle build --no-daemon 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Guardar JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ECLYNEVO-MOD
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
